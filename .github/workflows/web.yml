name: Test and publish web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o tpl.tpz $base/Godot_v${GODOT}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q -j tpl.tpz 'templates/web_nothreads_*' -d ~/.local/share/godot/export_templates/${GODOT}.stable
          rm godot.zip tpl.tpz
      - name: Test
        run: |
          godot --headless --import
          godot --headless --script res://tests/test_game_state.gd
      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
